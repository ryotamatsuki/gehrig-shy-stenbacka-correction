name: Compile correction note

on:
  push:
    branches: [main]
    paths:
      - "paper/**"
      - ".github/workflows/paper.yml"
  pull_request:
    paths:
      - "paper/**"
      - ".github/workflows/paper.yml"
  workflow_dispatch:

jobs:
  build-paper:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Compile manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: manuscript.tex
          working_directory: paper
          latexmk_use_xelatex: false
      - name: Confirm PDF exists
        run: test -s paper/manuscript.pdf
      - name: Enforce final-log QA
        run: |
          test "$(grep -c '^\\appendix' paper/manuscript.tex)" -eq 1
          test "$(grep -c '^\\end{document}' paper/manuscript.tex)" -eq 1
          if grep -E 'There were undefined (citations|references)|multiply defined|Missing character|LaTeX Error|Fatal error' paper/manuscript.log; then
            echo "Blocking LaTeX QA warning found"
            exit 1
          fi
          if grep -E 'Overfull \\hbox|Overfull \\vbox' paper/manuscript.log; then
            echo "Blocking layout overflow found"
            exit 1
          fi
      - name: Upload manuscript PDF and log
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-pdf
          path: |
            paper/manuscript.pdf
            paper/manuscript.log
