name: Verify correction mathematics

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  stage1-exact-recheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile verification code
        run: python -m compileall -q code
      - name: Run Stage 1 exact recheck
        run: python code/stage01_independent_recheck.py
      - name: Run Stage 4 global-validity checks
        run: python code/stage04_global_validity.py
      - name: Run Stage 4A independent adversarial checks
        run: python code/stage04a_cleanroom_adversarial.py
      - name: Run Stage 7 welfare decomposition
        run: python code/stage07_welfare_decomposition.py

  formal-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build and kernel-audit Lean proofs
        uses: leanprover/lean-action@v1
        with:
          build: true
          axiom-audit: true
          axiom-audit-root: GSSCorrection
          nanoda: true
          nanoda-allow-sorry: false
      - name: Reject proof placeholders
        run: |
          if grep -R -nE '\b(sorry|admit)\b' formal --include='*.lean'; then
            echo "Lean proof placeholder found"
            exit 1
          fi
